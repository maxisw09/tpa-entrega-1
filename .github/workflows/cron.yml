name: Cron - Tareas Programadas DonaTrack

on:
  schedule:
    # Ejecutar todos los días a las 03:00 AM (UTC)
    - cron: '0 3 * * *'
  workflow_dispatch: # Habilita botón para ejecución manual

jobs:
  ejecutar-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar Matchmaking
        run: |
          curl -X POST "${{ secrets.DONACIONES_URL }}/api/internal/cron/matchmaking" \
          -H "X-API-KEY: ${{ secrets.CRON_API_KEY }}"

      - name: Disparar Inactividad
        run: |
          curl -X POST "${{ secrets.DONACIONES_URL }}/api/internal/cron/inactividad" \
          -H "X-API-KEY: ${{ secrets.CRON_API_KEY }}"
